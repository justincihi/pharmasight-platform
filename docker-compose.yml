version: '3.8'

services:
  # PostgreSQL Database (shared by both applications)
  postgres:
    image: postgres:15-alpine
    container_name: pharmasight-db
    environment:
      POSTGRES_DB: pharmasight
      POSTGRES_USER: pharmasight
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmasight"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmasight-network

  # Redis Cache (for Flask app)
  redis:
    image: redis:7-alpine
    container_name: pharmasight-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmasight-network

  # Main Flask Application (Replit-December)
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmasight-flask
    environment:
      DATABASE_URL: postgresql://pharmasight:${DB_PASSWORD:-changeme}@postgres:5432/pharmasight
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./molecular_images:/app/molecular_images
    networks:
      - pharmasight-network
    restart: unless-stopped

  # Admin Dashboard (manus-December)
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: pharmasight-admin
    environment:
      DATABASE_URL: postgresql://pharmasight:${DB_PASSWORD:-changeme}@postgres:5432/pharmasight
      FLASK_API_URL: http://flask-app:5000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      flask-app:
        condition: service_started
    networks:
      - pharmasight-network
    restart: unless-stopped

  # Nginx Reverse Proxy (for subdomain routing)
  nginx:
    image: nginx:alpine
    container_name: pharmasight-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - flask-app
      - admin-dashboard
    networks:
      - pharmasight-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  pharmasight-network:
    driver: bridge
