services:
  # PostgreSQL Database
  - type: pserv
    name: pharmasight-db
    env: docker
    plan: starter
    region: oregon
    databases:
      - name: pharmasight
        databaseName: pharmasight
        user: pharmasight

  # Redis Cache
  - type: redis
    name: pharmasight-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru

  # Flask Application (Main Drug Discovery Platform)
  - type: web
    name: pharmasight-app
    env: docker
    region: oregon
    plan: starter
    branch: Combined
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmasight-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pharmasight-redis
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Admin Dashboard
  - type: web
    name: pharmasight-admin
    env: docker
    region: oregon
    plan: starter
    branch: Combined
    rootDir: admin-dashboard
    dockerfilePath: ./admin-dashboard/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmasight-db
          property: connectionString
      - key: FLASK_API_URL
        fromService:
          type: web
          name: pharmasight-app
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://pharmasight-app.onrender.com,https://pharmasight-admin.onrender.com
